name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip" # ช่วยให้ติดตั้ง packages เร็วขึ้นในรอบถัดไป
          
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      # ถ้าในอนาคตมีการเขียน Unit Test ด้วย pytest สามารถเปิดใช้งานส่วนนี้ได้
      # - name: 🧪 Run tests
      #   run: |
      #     pip install pytest
      #     pytest

      - name: 🔍 Check syntax & dependencies (Dry Run)
        run: |
          # ทดสอบว่าสามารถ Import FastAPI app ได้โดยไม่พัง (ตรวจสอบโค้ดพัง/ลืมติดตั้งแพ็กเกจ)
          python -c "from app.main import app; print('App loaded successfully!')"
          
